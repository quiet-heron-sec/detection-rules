title: Base64 Data In Random Named Value Under HKCU Software
id: ea89363c-1d9e-4d30-b9cc-22fc2862f9ed
related:
    - id: 85a40a22-91a2-4386-bcd5-621a6f7c348d
      type: similar
status: experimental
description: |
    Detects a long base64 string written to a value with an 8 character lowercase alphanumeric name, under a key directly below HKCU Software whose name has 14 lowercase alphanumeric characters. The reserve backdoor of the implant with the internal name hhunter stores its script this way, with names derived from its configuration.
    Prerequisite: value writes under HKU\<SID>\Software must be logged, by an EDR or by a Sysmon configuration with a broad registry scope. Usual Sysmon configurations do not log these keys, and the rule then returns nothing. Sysmon has no regular expression filter, so the key format cannot be selected at collection time.
references:
    - https://bazaar.abuse.ch/sample/5410f0b624c2e396134e96545fea2ced1421b29e7af6a3023790335c0979d772/
author: quiet-heron-sec
date: 2026-11-09
modified: 2026-11-09
tags:
    - attack.stealth
    - attack.persistence
    - attack.t1112
    - attack.t1027.011
logsource:
    category: registry_set
    product: windows
detection:
    selection_key:
        TargetObject|re: '^HKU\\S-1-5-21-[0-9-]+\\Software\\[a-z0-9]{14}\\[a-z0-9]{8}$'
    selection_data:
        Details|re: '^[A-Za-z0-9+/]{100,}'
    condition: all of selection_*
falsepositives:
    - Licensing, trial tracking or copy protection software that stores encoded data under a generated key name directly below HKCU Software
    - Installers or updaters that use generated key names and base64 encoded settings
level: medium
