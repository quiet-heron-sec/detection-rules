title: RuntimeBroker.exe Started From ProgramData
id: 96a6ff2a-133e-4d74-8a4c-77d9672a72fe
status: experimental
description: Detects RuntimeBroker.exe started from C:\ProgramData. The genuine binary lives in C:\Windows\System32. In a November 2026 fake plugin campaign (PluginDex), the payload of a malicious libcurl.dll copies itself to C:\ProgramData\Windows\Microsoft\RuntimeBroker.exe.
references:
    - https://bazaar.abuse.ch/sample/22dadd303759f12dc11a17b7612178dd5a8615cbf365a3a617faa181438c8273/
author: quiet-heron-sec
date: 2026-11-08
tags:
    - attack.stealth
    - attack.t1036.005
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\RuntimeBroker.exe'
        Image|startswith: 'C:\ProgramData\'
    condition: selection
falsepositives:
    - Unlikely
level: high
